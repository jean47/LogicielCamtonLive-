name: Sonde appelée (temporaire)
on:
  workflow_call:

permissions:
  contents: write

jobs:
  appele:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Écriture réelle depuis un job appelé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d '{"tag_name":"v0.0.0-probe2","name":"probe2","draft":true,"prerelease":true}')
          echo "appelé POST /releases => ${code}"
          head -c 300 /tmp/out.json; echo
