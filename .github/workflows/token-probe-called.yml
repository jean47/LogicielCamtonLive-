name: Sonde appelée (temporaire)
on:
  workflow_call:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Matrice des écritures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          c1=$(curl -s -o /tmp/a.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}/git/refs" -d '{"ref":"refs/tags/v0.0.0-probeT","sha":"e835f4b03855c961415914d1e447d9dc9cccd184"}')
          echo "tag => ${c1}"; head -c 150 /tmp/a.json; echo
          c2=$(curl -s -o /tmp/b.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}/releases" -d '{"tag_name":"v0.0.0-probeE","name":"probeE","draft":true,"prerelease":true}')
          echo "release brouillon => ${c2}"; head -c 150 /tmp/b.json; echo
          c3=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}/releases" -d '{"tag_name":"v0.0.0-probeF","name":"probeF","target_commitish":"e835f4b03855c961415914d1e447d9dc9cccd184","draft":false,"prerelease":false}')
          echo "release publique => ${c3}"; head -c 300 /tmp/c.json; echo
