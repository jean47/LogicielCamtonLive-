name: Sonde de permissions (temporaire)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - name: Écriture réelle depuis un job direct
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- en-têtes ---"
          curl -sI -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}" | grep -i "x-oauth-scopes\|x-accepted-github-permissions" || true
          echo "--- écriture ---"
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d '{"tag_name":"v0.0.0-probe","name":"probe","draft":true,"prerelease":true}')
          echo "direct POST /releases => ${code}"
          head -c 300 /tmp/out.json; echo

  appele:
    uses: ./.github/workflows/token-probe-called.yml
