name: Publication différée — 0.5.0

# Publie la 0.5.0 le 27 novembre 2026 à 11:00 à Paris (10:00 UTC, heure d'hiver),
# sans intervention manuelle. Le tag est créé au moment de la publication : tant que
# ce workflow n'a pas tourné, /releases/latest reste sur la version précédente.
#
# La cible est le commit du guide et de la FAQ. La branche principale est déjà passée
# en 0.5.1 (TikTok) : le garde-fou l'accepte, car une version supérieure signifie que
# les changements plus récents partent dans une publication ultérieure.
on:
  schedule:
    - cron: '0 10 27 11 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: La cible couvre-t-elle le code publié ?
        shell: bash
        run: bash .github/scripts/guard-release.sh .github/workflows/publish-0-5-0.yml

  publish:
    needs: garde
    uses: ./.github/workflows/release.yml
    with:
      tag: v0.5.0
      target: e835f4b03855c961415914d1e447d9dc9cccd184
