name: Publication différée — 0.5.1 (TikTok et relais)

# Publie la 0.5.1 le 2 décembre 2026 à 10:00 à Paris (09:00 UTC, heure d'hiver).
# C'est la version qui active la destination TikTok et la sortie relais.
#
# La cible est le commit qui porte ces deux destinations. Si du code livrable apparaît
# sur la branche sans changement de version d'ici là, le garde-fou échoue au lieu de
# publier une version amputée du correctif.
on:
  schedule:
    - cron: '0 9 2 12 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: La cible couvre-t-elle le code publié ?
        shell: bash
        run: bash .github/scripts/guard-release.sh .github/workflows/publish-0-5-1.yml

  publish:
    needs: garde
    # Sans ce bloc, un workflow réutilisable appelé depuis un job `uses:` reçoit un
    # jeton en lecture seule : la création de la release échoue en 403.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v0.5.1
      target: 0b030c6e76ae27306f681b2f58efd88b56b4ec12

  # Job direct : seul un workflow non réutilisable peut créer le tag de la release.
  publier:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: camton-build
          path: build
      - uses: ./.github/actions/publier-release
        with:
          tag: v0.5.1
          target: 0b030c6e76ae27306f681b2f58efd88b56b4ec12
