name: Publier une version Windows

# Crée une release GitHub complète à chaque tag `vX.Y.Z` :
# ZIP portable, Setup.exe, latest.json et SHA256.txt. Le manifeste est ensuite servi
# par https://github.com/<owner>/<repo>/releases/latest/download/latest.json
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Appelé par publish-0-5-2.yml pour publier à une date choisie.
  workflow_call:
    inputs:
      tag:
        description: 'Tag à publier (ex. v0.5.0)'
        type: string
        required: true
      target:
        description: 'Commit à taguer si le tag n’existe pas encore'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Les tests du moteur utilisent un faux FFmpeg écrit en shell : ils supposent un
  # système POSIX, d'où ce job Linux séparé du job d'empaquetage Windows.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier que le tag correspond à package.json
        shell: bash
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag différent de package.json ($version)"
            exit 1
          fi

      - run: npm ci

      - name: Installer NSIS
        run: choco install nsis --yes --no-progress

      # Sans secret, l'étape ne fait rien : la release part non signée, comme avant.
      # Avec WINDOWS_CERT_PFX (le .pfx en base64) et WINDOWS_CERT_PASSWORD, les trois
      # binaires sont signés dans le bon ordre par scripts/sign-windows.mjs.
      - name: Préparer le certificat de signature
        shell: bash
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$PFX_BASE64" ]; then
            echo "Aucun certificat configuré : la release partira non signée."
            exit 0
          fi
          echo "$PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/camton.pfx"
          echo "WINDOWS_CERT_PFX_PATH=$RUNNER_TEMP/camton.pfx" >> "$GITHUB_ENV"
          echo "WINDOWS_CERT_PASSWORD=$PFX_PASSWORD" >> "$GITHUB_ENV"

      - name: Construire l’interface
        run: npm run build

      - name: Récupérer FFmpeg Windows
        run: npm run ffmpeg:fetch

      - name: Empaqueter le ZIP portable et l’installateur
        shell: bash
        run: |
          npx electron-builder --win zip --x64
          node scripts/build-installer.mjs

      - name: Vérifier la signature des binaires
        if: env.WINDOWS_CERT_PFX_PATH != ''
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/sign-windows.mjs --verify \
            "release/Camton-Live-Setup-${version}-x64.exe" \
            "release/win-unpacked/Camton Live.exe" \
            "release/win-unpacked/resources/ffmpeg/bin/ffmpeg.exe"

      - name: Préparer le manifeste (empreinte et nouveautés)
        env:
          PUBLISH_URL_BASE: https://github.com/${{ github.repository }}/releases/latest/download
        run: node scripts/publish-update.mjs

      - name: Archiver les fichiers de la release
        uses: actions/upload-artifact@v4
        with:
          name: camton-build
          path: |
            release/Camton-Live-Setup-*.exe
            release/Camton-Live-Portable-*.zip
            dist-update/latest.json
            dist-update/SHA256.txt
          if-no-files-found: error

  # La publication se fait dans un job direct : un workflow réutilisable reçoit un
  # jeton incapable de créer un tag. Appelé depuis publish-0-5-*.yml, ce job est
  # ignoré et c'est le workflow appelant qui publie.
  publier:
    needs: windows
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: camton-build
          path: release-files
      - uses: ./.github/actions/publier-release
        with:
          tag: ${{ inputs.tag || github.ref_name }}
