name: Build de test (temporaire)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/release.yml
    with:
      tag: v0.5.2
      target: 84f8ee4642dee297be7e125f584164ad57a82877

  depot:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: camton-build
          path: release-files
      - name: Déposer la pré-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t fichiers < <(find release-files -type f | sort)
          ls -lh "${fichiers[@]}"
          gh release create v0.5.2-rc.3 "${fichiers[@]}" -R "$GITHUB_REPOSITORY" \
            --title "Camton Live 0.5.2 — build de test 3" \
            --prerelease \
            --notes "Build de test avec le limiteur audio et sondage des encodeurs à la résolution réelle."
