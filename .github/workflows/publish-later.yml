name: Publication différée

# Publie une version déjà taguée, à la date choisie, sans intervention manuelle.
# Le tag v0.5.0 est poussé mais aucune release n'existe tant que ce workflow n'a
# pas tourné : /releases/latest reste donc sur la version précédente.
#
# 2 décembre 2026, 09:00 UTC = 10:00 à Paris (heure d'hiver).
# GitHub peut décaler de quelques minutes en cas de forte charge.
on:
  schedule:
    - cron: '0 9 2 12 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Refuse de publier si du code applicatif a changé depuis la cible : le run doit
  # échouer bruyamment plutôt que livrer une bêta qui ignore les derniers correctifs.
  garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: La cible couvre-t-elle le code publié ?
        shell: bash
        run: |
          cible=$(sed -n 's/^ *target: *\([0-9a-f]\{40\}\) *$/\1/p' .github/workflows/publish-later.yml)
          if [ -z "$cible" ]; then
            echo "::error::Aucune cible lisible dans publish-later.yml."
            exit 1
          fi
          if ! git cat-file -e "${cible}^{commit}" 2>/dev/null; then
            echo "::error::La cible $cible est introuvable dans le dépôt."
            exit 1
          fi
          # Seuls les fichiers non livrés (workflows, docs) peuvent différer : une
          # modif de README ne doit pas bloquer la publication, un changement de
          # code ou d'empaquetage si.
          if ! git diff --quiet "$cible" HEAD -- . ':(exclude).github' ':(exclude)docs' ':(exclude)*.md'; then
            echo "::error::Du code a changé depuis la cible $cible :"
            git --no-pager diff --stat "$cible" HEAD -- . ':(exclude).github' ':(exclude)docs' ':(exclude)*.md'
            echo "Mets à jour le champ target de publish-later.yml, ou assume l'ancienne version."
            exit 1
          fi

  publish:
    needs: garde
    uses: ./.github/workflows/release.yml
    with:
      tag: v0.5.0
      # Commit de la 0.5.0 : le tag n'est créé qu'au moment de la publication.
      target: 7014fdd455e89a7ea84b6f428df42f776955c0e6
