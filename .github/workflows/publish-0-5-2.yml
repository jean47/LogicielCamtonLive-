name: Publication différée — 0.5.2 (TikTok, relais, supervision, débit, rapport)

# Publie la 0.5.2 le 2 décembre 2026 à 11:00 à Paris (10:00 UTC, heure d'hiver).
# Cette version réunit les deux publications prévues : TikTok par clé de flux, sortie
# relais RTMP, supervision du débit par destination, test de débit montant, quatre
# destinations et rapport de problème. La 0.5.1 n'existe pas.
#
# La cible est le commit qui porte tous ces chantiers. Si du code livrable apparaît
# sur la branche sans changement de version d'ici là, le garde-fou échoue au lieu de
# publier une version amputée du correctif.
on:
  schedule:
    - cron: '0 10 2 12 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: La cible couvre-t-elle le code publié ?
        shell: bash
        run: bash .github/scripts/guard-release.sh .github/workflows/publish-0-5-2.yml

  publish:
    needs: garde
    # Sans ce bloc, un workflow réutilisable appelé depuis un job `uses:` reçoit un
    # jeton en lecture seule : la création de la release échoue en 403.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v0.5.2
      target: f2ea58b677b9edbe653817a51b9cc5dc984b051f

  # Job direct : seul un workflow non réutilisable peut créer le tag de la release.
  publier:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: camton-build
          path: release-files
      - uses: ./.github/actions/publier-release
        with:
          tag: v0.5.2
          target: f2ea58b677b9edbe653817a51b9cc5dc984b051f
