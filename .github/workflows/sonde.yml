name: Sonde publication (temporaire)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p release-files && echo essai > release-files/essai.txt
      - uses: ./.github/actions/publier-release
        with:
          tag: v0.0.0-sonde
