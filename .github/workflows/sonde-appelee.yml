name: Sonde appelée (temporaire)
on:
  workflow_call:
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Créer un tag depuis un job appelé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/o.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" -d '{"ref":"refs/tags/v0.0.0-sonde","sha":"e835f4b03855c961415914d1e447d9dc9cccd184"}')
          echo "tag depuis job appelé => ${code}"
          head -c 200 /tmp/o.json; echo
